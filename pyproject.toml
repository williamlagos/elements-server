[project]
name = "elements-server"
version = "1.0.0"
description = "asyncio-powered multiplayer game server"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game"]

[tool.uv]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
